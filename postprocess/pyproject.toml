[project]
name = "meetingrec-postprocess"
version = "0.2.0"
description = "Transcribe meetingrec WAV recordings with Amazon Transcribe and summarize via Bedrock Opus (Strands Agents)."
requires-python = ">=3.10,<3.14"
dependencies = [
    # 1.40+ is needed for AWS_BEARER_TOKEN_BEDROCK support (Bedrock API keys).
    "boto3>=1.40",
    "strands-agents>=0.1",
]

[project.scripts]
meetingrec-postprocess = "meetingrec_postprocess.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meetingrec_postprocess"]
